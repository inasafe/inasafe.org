site_name: InaSAFE
site_url: https://inasafe.org/
site_description: >-
  InaSAFE is free software that produces realistic natural hazard impact
  scenarios for better planning, preparedness and response activities.
repo_url: https://github.com/inasafe/inasafe.org
repo_name: inasafe/inasafe.org
# Deliberately NOT "docs" — that directory is still the legacy WordPress
# static export and must stay untouched until content migration (and the
# hosting cutover) is complete. Rename to "docs" only as the final step of
# retiring the old export.
docs_dir: docs
edit_uri: edit/main/docs/

copyright: Copyright &copy; InaSAFE contributors

theme:
  name: material
  custom_dir: overrides
  logo: assets/branding/logo.svg
  favicon: assets/branding/favicon.png
  font:
    text: Ubuntu
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - tags
  - git-revision-date-localized
  - glightbox

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

