name: 📚 Docs

# NOTE: this targets `main`, the branch this repo's default branch is being
# renamed to (it's still `master` as of this commit) — see SPECIFICATION.md
# §6. Update this if the rename hasn't happened yet by the time this merges.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs_new/**"
      - "mkdocs.yml"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/Docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for git-revision dates)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Build mkdocs site (strict)
        run: |
          nix develop --command mkdocs build --strict --site-dir site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
